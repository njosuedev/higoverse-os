# Live snapshot of /etc/nginx/sites-available/aandt.conf, captured after
# certbot ran. The "managed by Certbot" blocks below are auto-generated —
# on a fresh box, write everything ABOVE those blocks yourself (see
# DEPLOYMENT.md §5.12), then let `certbot --nginx -d atconsultants.rw ...`
# add the SSL server block and the HTTP->HTTPS redirect itself. Don't
# hand-copy the ssl_certificate paths here onto a box that doesn't have
# those cert files yet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name atconsultants.rw;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- Backend services, reachable directly under /svc/<name>/ ----
    # Prefix is stripped before forwarding (trailing slash on both sides).
    # FastAPI's trailing-slash redirect (e.g. /products -> /products/) is
    # built from the Host header we forward, so it comes back missing the
    # /svc/<name> prefix nginx just stripped — proxy_redirect adds it back
    # so the browser's follow-up request lands in the right place instead
    # of hitting the frontend's own router at the bare path.
    location /svc/auth/       { proxy_pass http://127.0.0.1:8000/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/auth$2; }
    location /svc/products/   { proxy_pass http://127.0.0.1:8001/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/products$2; }
    location /svc/suppliers/  { proxy_pass http://127.0.0.1:8002/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/suppliers$2; }
    location /svc/sales/      { proxy_pass http://127.0.0.1:8003/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/sales$2; }
    location /svc/purchases/  { proxy_pass http://127.0.0.1:8004/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/purchases$2; }
    location /svc/expenses/   { proxy_pass http://127.0.0.1:8005/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/expenses$2; }
    location /svc/settings/   { proxy_pass http://127.0.0.1:8006/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/settings$2; }
    location /svc/shops/      { proxy_pass http://127.0.0.1:8007/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/shops$2; }
    location /svc/reports/    { proxy_pass http://127.0.0.1:8008/; proxy_redirect ~^(https?://[^/]+)(/.*)$ $1/svc/reports$2; }

    # ---- Everything else: Next.js frontend ----
    # (handles /api/purchases/* and /api/expenses/* itself via its own
    # server-side rewrite to the internal backend ports.)
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/atconsultants.rw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/atconsultants.rw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = atconsultants.rw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name atconsultants.rw;
    return 404; # managed by Certbot


}
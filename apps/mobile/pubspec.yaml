name: higoverse_inventory_mobile
description: Higoverse mobile app — stock, sales and account on the go.
publish_to: "none"
version: 1.15.0+21

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter's own texts (dialogs, tooltips) in French, Swahili and Chinese.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP calls to the Higoverse services.
  http: ^1.2.2
  # Tokens are kept in the platform keystore (Android Keystore / iOS Keychain).
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  in_app_update: ^5.0.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the launcher icons from assets/ (dart run flutter_launcher_icons).
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/higoverse-logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon-foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

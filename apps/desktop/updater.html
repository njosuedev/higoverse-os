<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Higoverse update</title>
<style>
  /* The update window: prompt → download progress → installing (or an
     error). main.js drives it with render({...}); buttons answer through
     updater-preload.js. Follows Windows light/dark. */
  :root { --bg: #ffffff; --text: #191919; --muted: #474747; --faint: #6b6b6b; --track: #e8e7e4; --line: #e0dfdc;
          --ink: #0a66c2; --ink-hover: #004182; --danger: #cc1016; --soft: #f4f2ee; }
  @media (prefers-color-scheme: dark) {
    /* Instagram's raised pop-up: #212328, grey #363636 buttons, blue #0095f6. */
    :root { --bg: #212328; --text: #f5f5f5; --muted: #c7c7c7; --faint: #a8a8a8; --track: #2b3036; --line: #363636;
            --ink: #0095f6; --ink-hover: #1877f2; --danger: #ed4956; --soft: #2b3036; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 500 13px/1.45 "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; padding: 20px 22px 16px; border: 1px solid var(--line); -webkit-app-region: drag; }
  button, a, .notes { -webkit-app-region: no-drag; }
  .head { display: flex; align-items: center; gap: 14px; }
  .head img { width: 40px; height: 40px; border-radius: 9px; flex: none; }
  .title { font-weight: 700; font-size: 16px; }
  .sub { color: var(--ink); font-weight: 600; font-size: 13px; }
  .text { color: var(--muted); margin-top: 14px; white-space: pre-line; }
  .notes { margin-top: 10px; padding: 10px 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px;
    max-height: 92px; overflow: auto; white-space: pre-wrap; color: var(--text); -webkit-user-select: text; user-select: text; }
  .notes:empty { display: none; }
  .bar { height: 8px; border-radius: 4px; background: var(--track); margin-top: 14px; overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 4px; background: var(--ink); transition: width .25s ease; }
  .bar.indeterminate .fill { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .figures { margin-top: 8px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .error { color: var(--danger); }
  .rings { width: 34px; height: 34px; display: block; margin: 16px auto 0; }
  .rings circle { fill: none; stroke-linecap: round; transform-origin: 50% 50%; }
  .track { stroke: var(--track); } .arc { stroke: var(--ink); }
  .r1 { animation: spin 1.8s linear infinite; } .r2 { animation: spin 1.2s linear infinite reverse; opacity: .8; }
  .r3 { animation: spin .9s linear infinite; opacity: .6; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .r1, .r2, .r3, .bar.indeterminate .fill { animation: none; } }
  .actions { margin-top: auto; padding-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--ink); color: #fff; }
  .primary:hover { background: var(--ink-hover); }
  @media (prefers-color-scheme: dark) {
    .primary { background: #0095f6; } .primary:hover { background: #1877f2; }
    .plain { background: #363636; color: #fafafa; } .plain:hover { background: #262626; }
  }
  .plain { background: transparent; color: var(--muted); }
  .plain:hover { background: var(--track); color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="head">
    <img src="assets/icon.png" alt="">
    <div>
      <div class="title" id="title">Higoverse</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="text" id="text" role="status" aria-live="polite"></div>
  <div class="notes" id="notes"></div>
  <div id="progress" hidden>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <div class="figures" id="figures"></div>
  </div>
  <svg class="rings" id="rings" viewBox="0 0 40 40" aria-hidden="true" hidden>
    <circle class="track" cx="20" cy="20" r="17" stroke-width="3.4"/><circle class="arc r1" cx="20" cy="20" r="17" stroke-width="3.4" stroke-dasharray="72 200"/>
    <circle class="track" cx="20" cy="20" r="10.5" stroke-width="3.4"/><circle class="arc r2" cx="20" cy="20" r="10.5" stroke-width="3.4" stroke-dasharray="33 200"/>
    <circle class="track" cx="20" cy="20" r="4.4" stroke-width="3.4"/><circle class="arc r3" cx="20" cy="20" r="4.4" stroke-width="3.4" stroke-dasharray="11 200"/>
  </svg>
  <div class="actions" id="actions"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const send = (action) => window.hgvUpdate && window.hgvUpdate.send(action);

  // state: { title, sub, text, notes, error, progress: {percent|null, figures}, rings,
  //          actions: [{ id, label, primary }] }
  window.render = (s) => {
    $("title").textContent = s.title || "Higoverse";
    $("sub").textContent = s.sub || "";
    $("text").textContent = s.text || "";
    $("text").classList.toggle("error", !!s.error);
    $("notes").textContent = s.notes || "";
    $("progress").hidden = !s.progress;
    if (s.progress) {
      const known = typeof s.progress.percent === "number";
      $("bar").classList.toggle("indeterminate", !known);
      $("fill").style.width = known ? Math.max(1, Math.min(100, s.progress.percent)) + "%" : "";
      $("figures").textContent = s.progress.figures || "";
    }
    // SVG elements have no .hidden property: toggle the attribute.
    $("rings").toggleAttribute("hidden", !s.rings);
    const box = $("actions");
    box.replaceChildren(...(s.actions || []).map((a) => {
      const b = document.createElement("button");
      b.textContent = a.label;
      b.className = a.primary ? "primary" : "plain";
      b.addEventListener("click", () => send(a.id));
      return b;
    }));
    const primary = box.querySelector(".primary");
    if (primary) primary.focus();
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") send("escape"); });
</script>
</body>
</html>

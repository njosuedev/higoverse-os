<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Higoverse</title>
<style>
  /* What the main window shows from the moment it opens until higoverse.com
     has answered, filling the whole window like WhatsApp's: the logo in the
     middle, a thin moving bar (no percentage), the name, and a privacy line
     at the bottom. Website colours; main.js passes the theme, language and
     texts in the query. Follows "reduce motion". */
  :root { --paper: #f4f2ee; --track: #e0dfdc; --ink: #0a66c2; --text: #191919; --muted: #474747; }
  :root[data-theme="dark"] { --paper: #0c1014; --track: #25292e; --ink: #0095f6; --text: #f5f5f5; --muted: #a8a8a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--text); overflow: hidden; cursor: progress;
    font: 400 13px/1.45 "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  .bar { position: relative; width: 280px; height: 4px; margin-top: 40px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar span { position: absolute; top: 0; bottom: 0; left: 0; width: 35%; border-radius: 2px; background: var(--ink);
    animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; opacity: .7; } }
  .name { margin-top: 22px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  #status { margin-top: 6px; min-height: 1.45em; color: var(--muted); opacity: 0; transition: opacity .4s; }
  #status.on { opacity: 1; }
  footer { position: fixed; left: 0; right: 0; bottom: 28px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); }
  footer svg { width: 13px; height: 13px; fill: currentColor; }
</style>
<script>
  // Before the first paint, so dark mode never starts light.
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") === "dark" ? "dark" : "light";
  document.documentElement.lang = q.get("lang") || "en";
</script>
</head>
<body aria-busy="true">
  <img src="assets/icon.png" alt="">
  <div class="bar" role="progressbar" id="bar"><span></span></div>
  <div class="name">Higoverse</div>
  <div id="status" role="status"></div>
  <footer>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9z"/></svg>
    <span id="private"></span>
  </footer>
  <script>
    document.getElementById("bar").setAttribute("aria-label", q.get("loading") || "Opening Higoverse…");
    document.getElementById("private").textContent = q.get("private") || "Your business records are private and secure";
    // Only a slow start gets words.
    setTimeout(() => {
      const s = document.getElementById("status");
      s.textContent = q.get("slow") || "Still connecting. Your internet seems slow.";
      s.classList.add("on");
    }, 8000);
  </script>
</body>
</html>
